{% extends "admin/base_site.html" %}

{% block content %}

<div id="content-main">

    <h1>{{ title }}</h1>

    <form method="post" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="submit-row">
            <input
                type="submit"
                value="Subir e Importar CSV"
                class="default"
            >

            <a href="../">
                Cancelar
            </a>
        </div>

    </form>

</div>

{% endblock %}
